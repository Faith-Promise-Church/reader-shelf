<style>
/* ============================================================
   LOCK SCREEN  ·  wraps every published page (build.py --publish)
   The real page is AES-256-CTR encrypted below, with an HMAC-SHA256
   tag. The key comes from the password via PBKDF2-SHA256. Once a
   password works, the derived key (never the password) can be kept
   on this device so every page on the shelf opens without asking.
   ============================================================ */
:root{--paper:#f4efe5;--panel:#f8f4ec;--ink:#2c2521;--ink-soft:#6b5f53;--ink-faint:#9a8d7e;--accent:#b1481c;--line:rgba(44,37,33,.16);}
@media (prefers-color-scheme: dark){:root{--paper:#1a1714;--panel:#211d19;--ink:#ece3d4;--ink-soft:#b3a795;--ink-faint:#7c7163;--accent:#e0884f;--line:rgba(236,227,212,.16);}}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:grid;place-items:center;padding:16px;}
.card{width:100%;max-width:340px;text-align:center;display:none;}
.card.show{display:block;}
svg{width:40px;height:40px;margin-bottom:14px;}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:22px;}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);outline:none;}
input[type=password]:focus{border-color:var(--accent);}
button{margin-top:12px;width:100%;font:inherit;font-size:16px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;}
button:disabled{opacity:.6;cursor:wait;}
label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px;font-size:14px;color:var(--ink-soft);cursor:pointer;}
label input{accent-color:var(--accent);}
.err{min-height:20px;margin-top:12px;font-size:14px;color:var(--accent);}
.busy{color:var(--ink-faint);font-style:italic;}
</style>
</head>

</form>

const KEY = "reader-shelf:key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const unb64 = u => btoa(String.fromCharCode(...u));
async function open(raw){
  const all = b64(LOCK.data), iv = all.slice(0, 16), tag = all.slice(all.length - 32), ct = all.slice(16, all.length - 32);
  const mac = await crypto.subtle.importKey("raw", raw.slice(32, 64), {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, 16);
  if(!await crypto.subtle.verify("HMAC", mac, tag, signed)) return false;
  const aes = await crypto.subtle.importKey("raw", raw.slice(0, 32), {name:"AES-CTR"}, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CTR", counter:iv, length:128}, aes, ct));
  // document.open() only replaces the page once this one has finished parsing; before that it appends
  if(document.readyState !== "complete") await new Promise(r => addEventListener("load", r, {once:true}));
  document.open(); document.write(html); document.close();
  return true;
}
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(LOCK.salt), iterations:LOCK.iterations}, base, 512);
  return new Uint8Array(bits);
}
function ask(msg){
  document.getElementById("busy").style.display = "none";
  document.getElementById("card").classList.add("show");
  document.getElementById("err").textContent = msg || "";
  document.getElementById("pw").focus();
}
document.getElementById("card").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "Checking…";
  try{
    const raw = await derive(document.getElementById("pw").value);
    if(document.getElementById("remember").checked){ try{ localStorage.setItem(KEY, unb64(raw)); }catch(_){} }
    else { try{ sessionStorage.setItem(KEY, unb64(raw)); localStorage.removeItem(KEY); }catch(_){} }
    if(await open(raw)) return;
    try{ localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); }catch(_){}
    ask("That password didn’t work.");
  }catch(err){ ask("This browser can’t open the page (" + err.name + ")."); }
  btn.disabled = false; btn.textContent = "Open";
});
(async () => {
  let saved = null;
  try{ saved = localStorage.getItem(KEY) || sessionStorage.getItem(KEY); }catch(_){}
  if(saved){
    try{ if(await open(b64(saved))) return; }catch(_){}
    try{ localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); }catch(_){}
    return ask("The password has changed. Please enter it again.");
  }
  ask();
})();
</script>
